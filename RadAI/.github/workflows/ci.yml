name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "RadAI/backend/**"
      - "RadAI/scripts/**"
      - "RadAI/Makefile"
      - "RadAI/docker-compose.yml"
      - "RadAI/.github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "RadAI/backend/**"
      - "RadAI/scripts/**"
      - "RadAI/Makefile"
      - "RadAI/docker-compose.yml"

env:
  PYTHON_VERSION: "3.11"
  WORKING_DIRECTORY: RadAI/backend

jobs:
  # ─── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: RadAI/backend/requirements*.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check app/ scripts/ tests/

  # ─── Type Check ────────────────────────────────────────────────────────────
  type-check:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: RadAI/backend/requirements*.txt

      - name: Install MyPy
        run: pip install mypy

      - name: Run MyPy (best-effort)
        run: |
          mypy app/scheduler.py app/auth.py app/config.py --ignore-missing-imports || true

  # ─── Unit Tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radai
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: test_radai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: RadAI/backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install aiosqlite

      - name: Set test environment variables
        run: |
          echo "JWT_SECRET=test-secret-key-at-least-32-chars-long!!" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=test-password" >> $GITHUB_ENV
          echo "ORTHANC_PASSWORD=test" >> $GITHUB_ENV
          echo "ENVIRONMENT=testing" >> $GITHUB_ENV

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ${{ env.WORKING_DIRECTORY }}/coverage.xml
          fail_ci_if_error: false

  # ─── Docker Build ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RadAI
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker compose build backend
        env:
          DOCKER_BUILDKIT: 1

      - name: Verify image-exists
        run: docker images | grep radai-backend || exit 1

  # ─── Integration Test ──────────────────────────────────────────────────────
  integration:
    name: Integration Test (Docker stack)
    runs-on: ubuntu-latest
    needs: [docker-build]
    defaults:
      run:
        working-directory: RadAI
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp .env.development .env
          docker compose up -d postgres redis
          sleep 10

      - name: Health check
        run: |
          docker compose ps
          docker compose logs postgres --tail=20
          docker compose logs redis --tail=20

      - name: Verify PostgreSQL
        run: docker compose exec -T postgres pg_isready -U radai -d radai

      - name: Verify Redis
        run: docker compose exec -T redis redis-cli ping

      - name: Stack logs
        if: always()
        run: docker compose logs --tail=50

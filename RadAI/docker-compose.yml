# docker-compose.yml — RadAI Full Stack
# Unified entrypoint via secure Nginx proxy (HTTPS)

services:
  # ─── OHIF Viewer (Frontend) ───────────────────────────────────────────────
  ohif:
    image: ohif/app:v3.12.0
    container_name: radai-ohif
    # Host port 3000 removed - access via Nginx 443
    volumes:
      - ./docker/ohif/app-config.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      orthanc:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - radai-net

  # ─── Orthanc PACS Server ─────────────────────────────────────────────────
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: radai-orthanc
    ports:
      - "4242:4242"    # Keep raw DICOM protocol port
    # Web port 8042 removed - access via Nginx /orthanc/
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-db:/var/lib/orthanc/db
    environment:
      ORTHANC__NAME: "RadAI PACS"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"orthanc": "${ORTHANC_PASSWORD}"}'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --http-user=orthanc --http-passwd=${ORTHANC_PASSWORD} http://localhost:8042/system || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - radai-net

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: radai-postgres
    # Port 5432 removed from public exposure
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radai}
      POSTGRES_USER: ${POSTGRES_USER:-radai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radai} -d ${POSTGRES_DB:-radai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - radai-net

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: radai-redis
    # Port 6379 removed from public exposure
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - radai-net

  # ─── RadAI FastAPI Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radai-backend
    # Port 8000 removed - access via Nginx /api/
    volumes:
      - ./backend:/app
      - temp-processing:/tmp/radai-processing
      - ./reports:/app/reports
    env_file:
      - .env
    environment:
      - ORTHANC_URL=http://orthanc:8042
      - DATABASE_URL=postgresql://${POSTGRES_USER:-radai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - radai-net

  # ─── Celery Worker (Async Jobs) ───────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radai-celery
    command: celery -A app.queue.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - temp-processing:/tmp/radai-processing
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-radai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-radai}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - radai-net

  # ─── Nginx Reverse Proxy (Gateway) ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: radai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - ohif
      - orthanc
      - backend
    restart: unless-stopped
    networks:
      - radai-net

networks:
  radai-net:
    driver: bridge

volumes:
  orthanc-db:
  postgres-data:
  redis-data:
  temp-processing:

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting for API
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name localhost;

        # Self-signed certificates (generated in next step)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Recommended SSL settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        # Medical data privacy: Prevent caching of sensitive routes
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # 1. OHIF Viewer (Root)
        location / {
            proxy_pass http://ohif:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Orthanc PACS (DicomWeb)
        # Note: Orthanc usually needs specific proxy headers for DicomWeb to work correctly
        location /orthanc/ {
            rewrite /orthanc/(.*) /$1 break;
            proxy_pass http://orthanc:8042;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Orthanc specific
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        # 3. Backend API
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Support WebSockets for AI progress tracking
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 4. RadAI Extensions (served statically to OHIF)
        location /radai-extensions/ {
            alias /etc/nginx/radai-extensions/;
            add_header Cache-Control "public, max-age=3600";
        }

        # 5. RadAI Findings Panel
        location /radai-findings/ {
            alias /etc/nginx/radai-findings/;
            add_header Cache-Control "public, max-age=3600";
        }

        # 6. RadAI Reporting Panel
        location /radai-reporting/ {
            alias /etc/nginx/radai-reporting/;
            add_header Cache-Control "public, max-age=3600";
        }

        # OHIF health check
        location /health {
            proxy_pass http://backend:8000/health;
        }
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }
}
